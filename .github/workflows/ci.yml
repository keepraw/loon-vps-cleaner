name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: registry/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r registry/requirements.txt pytest
      - name: Check syntax
        run: |
          bash -n install.sh setup.sh update.sh backup.sh
          node --check registry/static/app.js
          python -m compileall -q registry/app.py registry/core.py
      - name: Test Node Registry (mocked Sub-Store)
        run: python -m pytest -q registry/tests
      - name: Check public source package hygiene
        run: |
          test ! -e .env
          test ! -d data
          test -f .env.example
