services:
  registry:
    networks:
      core: {}
      web: {}

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_HASH: ${ADMIN_HASH}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web: {}
    depends_on:
      - registry
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web: {}

volumes:
  caddy_data:
  caddy_config:
