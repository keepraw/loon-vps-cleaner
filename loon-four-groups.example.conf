# Add this single URL to Loon. Region tags are generated by the VPS.
[Remote Proxy]
VPS = https://example.com/loon/all/ALL_TOKEN,enabled=true,parser-enabled=false

# These three local filters split the one subscription into regional groups.
# The VPS adds stable "HK - " / "US - " / "JP - " prefixes to published node names.
[Remote Filter]
VPS-HK = NameRegex,VPS,FilterKey = "^HK - "
VPS-US = NameRegex,VPS,FilterKey = "^US - "
VPS-JP = NameRegex,VPS,FilterKey = "^JP - "

[Proxy Group]
香港服务 = select,VPS-HK
美国服务 = select,VPS-US
日本服务 = select,VPS-JP
海外服务 = select,VPS
